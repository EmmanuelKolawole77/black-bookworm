<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Black Bookworm</title>
  <meta name="description" content="Sign in to Black Bookworm to shop Nigerian and African stories.">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link href="style.css" rel="stylesheet">
  <link href="login.css" rel="stylesheet">
</head>
<body class="login-body">

  <main class="login-layout">

    <!-- Left: brand panel -->
    <aside class="login-brand" aria-hidden="true">
      <div>
        <p class="login-logo">Black Bookworm</p>
        <h1>Nigerian stories, delivered to your door.</h1>
        <p class="login-tag">Novels, memoirs, business and children's books from Nigerian and African authors.</p>
      </div>
      <div class="login-covers" id="loginCovers"></div>
    </aside>

    <!-- Right: sign in panel -->
    <section class="login-panel">
      <div class="login-card">
        <p class="login-logo login-logo-mobile">Black Bookworm</p>
        <h2 id="loginTitle">Welcome back</h2>
        <p class="muted" id="loginSub">Sign in to start shopping.</p>

        <div class="alert alert-danger py-2 d-none" id="loginError" role="alert"></div>
        <div class="alert alert-success py-2 d-none" id="loginInfo" role="status"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3 d-none" id="nameField">
            <label for="loginName" class="form-label">Full name</label>
            <input type="text" class="form-control" id="loginName" autocomplete="name">
          </div>
          <div class="mb-3">
            <label for="loginId" class="form-label" id="idLabel">Email address or admin ID</label>
            <input type="text" class="form-control" id="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required>
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="pw-wrap">
              <input type="password" class="form-control" id="loginPassword" autocomplete="current-password" required minlength="6">
              <button type="button" class="pw-toggle" id="pwToggle" aria-label="Show password"><i class="bi bi-eye" aria-hidden="true"></i></button>
            </div>
          </div>
          <button type="submit" class="btn-solid btn-wide" id="loginSubmit">Sign in</button>
        </form>

        <div class="or-line"><span>or</span></div>
        <button type="button" class="btn-outline btn-wide" id="googleBtn">
          <i class="bi bi-google" aria-hidden="true"></i> Continue with Google
        </button>

        <p class="login-switch" id="forgotRow"><button type="button" class="link-button" id="forgotBtn">Forgot password?</button></p>
        <p class="login-switch" id="switchRow"></p>

        <p class="demo-note d-none" id="demoNote"></p>
      </div>
    </section>
  </main>

  

  <script type="module" src="login.js"></script>
</body>
</html>
